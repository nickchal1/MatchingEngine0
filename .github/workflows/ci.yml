name: CI

on:
    push:
    pull_request:

jobs:
    build_test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4
            - name: Cmake
              run: cmake -S . -B build
            - name: Build
              run: cmake --build build
            - name: Run tests
              run: ctest --test-dir build --output-on-failure



