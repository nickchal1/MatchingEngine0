name: CI

on:
    push:
      branches:
        - main
    pull_request:
      branches:
        - main

jobs:
    build_test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@v6
            - name: Cmake
              run: cmake -S . -B build
            - name: Build
              run: cmake --build build
            - name: Run tests
              run: ctest --test-dir build --output-on-failure



